<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Defender</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #05070f;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  canvas {
    background: radial-gradient(ellipse at center, #0a1128 0%, #05070f 100%);
    display: block;
    box-shadow: 0 0 40px rgba(80,140,255,0.15);
  }
  #hud {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; justify-content: space-between;
    color: #d7e4ff; font-size: 18px; font-weight: 600;
    text-shadow: 0 0 6px rgba(80,140,255,0.6);
    pointer-events: none;
    letter-spacing: 0.5px;
  }
  #overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #eaf2ff; text-align: center;
    background: rgba(5,7,15,0.75);
  }
  #overlay h1 { font-size: 38px; margin: 0 0 8px; text-shadow: 0 0 14px #4a90ff; }
  #overlay p { font-size: 15px; color: #9fb3d9; margin: 4px 0 18px; max-width: 360px; }
  #overlay button {
    background: #2a63d9; color: white; border: none; padding: 12px 28px;
    font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
    box-shadow: 0 0 16px rgba(42,99,217,0.6);
  }
  #overlay button:hover { background: #3b74eb; }
  #overlay .stats { font-size: 20px; margin-bottom: 4px; }
  #mobileControls {
    position: absolute; bottom: 16px; left: 0; right: 0;
    display: none; justify-content: space-between; padding: 0 16px;
    pointer-events: none;
  }
  #mobileControls button {
    pointer-events: auto;
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(80,140,255,0.25); border: 1px solid rgba(160,200,255,0.4);
    color: white; font-size: 22px;
  }
  @media (max-width: 700px) {
    #mobileControls { display: flex; }
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div id="lives">Lives: 3</div>
  </div>
  <div id="overlay">
    <h1>Star Defender</h1>
    <p>Arrow keys / WASD to move, Space to shoot.<br>Survive the waves and rack up points.</p>
    <button id="startBtn">Start Game</button>
  </div>
  <div id="mobileControls">
    <button id="leftBtn">◀</button>
    <button id="fireBtn">🔥</button>
    <button id="rightBtn">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// Mobile buttons
const bind = (id, key) => {
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
};
bind('leftBtn', 'arrowleft');
bind('rightBtn', 'arrowright');
bind('fireBtn', ' ');

let running = false;
let score = 0;
let lives = 3;
let frame = 0;

const player = { x: W/2, y: H - 60, w: 34, h: 34, speed: 5.5, cooldown: 0 };
let bullets = [];
let enemyBullets = [];
let enemies = [];
let particles = [];
let stars = [];
let waveTimer = 0;
let waveNumber = 1;

for (let i = 0; i < 80; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8+0.3, s: Math.random()*1.5+0.3 });
}

function resetGame() {
  score = 0; lives = 3; frame = 0; waveNumber = 1; waveTimer = 0;
  player.x = W/2; player.y = H-60; player.cooldown = 0;
  bullets = []; enemyBullets = []; enemies = []; particles = [];
  scoreEl.textContent = score;
  livesEl.textContent = 'Lives: ' + lives;
}

function spawnWave() {
  const rows = Math.min(2 + Math.floor(waveNumber/2), 5);
  const cols = 6;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      enemies.push({
        x: 60 + c * 60,
        y: 50 + r * 50,
        w: 30, h: 24,
        vx: 1 + waveNumber*0.15,
        dir: 1,
        alive: true,
        shootChance: 0.0015 + waveNumber*0.0004,
        hue: 200 + r*25
      });
    }
  }
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-0.5)*6,
      life: 30 + Math.random()*20,
      color
    });
  }
}

function update() {
  frame++;

  // stars
  stars.forEach(s => {
    s.y += s.s;
    if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
  });

  // player movement
  if ((keys['arrowleft'] || keys['a']) && player.x > player.w/2) player.x -= player.speed;
  if ((keys['arrowright'] || keys['d']) && player.x < W - player.w/2) player.x += player.speed;
  if ((keys['arrowup'] || keys['w']) && player.y > H/2) player.y -= player.speed;
  if ((keys['arrowdown'] || keys['s']) && player.y < H - player.h/2) player.y += player.speed;

  if (player.cooldown > 0) player.cooldown--;
  if (keys[' '] && player.cooldown === 0) {
    bullets.push({ x: player.x, y: player.y - 20, vy: -9, w: 4, h: 12 });
    player.cooldown = 10;
  }

  // bullets
  bullets.forEach(b => b.y += b.vy);
  bullets = bullets.filter(b => b.y > -20);

  enemyBullets.forEach(b => b.y += b.vy);
  enemyBullets = enemyBullets.filter(b => b.y < H + 20);

  // enemies
  let edge = false;
  enemies.forEach(en => {
    if (!en.alive) return;
    en.x += en.vx * en.dir;
    if (en.x < 20 || en.x > W - 20) edge = true;
    if (Math.random() < en.shootChance) {
      enemyBullets.push({ x: en.x, y: en.y + 15, vy: 4.5, w: 4, h: 12 });
    }
  });
  if (edge) {
    enemies.forEach(en => { en.dir *= -1; en.y += 14; });
  }

  // enemy reaches player row -> lose life & remove
  enemies.forEach(en => {
    if (en.alive && en.y > H - 100) {
      en.alive = false;
      loseLife();
      spawnParticles(en.x, en.y, '80,140,255', 10);
    }
  });

  // bullet-enemy collisions
  bullets.forEach(b => {
    enemies.forEach(en => {
      if (!en.alive) return;
      const bb = { x: b.x-2, y: b.y-6, w: 4, h: 12 };
      const eb = { x: en.x-en.w/2, y: en.y-en.h/2, w: en.w, h: en.h };
      if (rectsOverlap(bb, eb)) {
        en.alive = false;
        b.y = -999;
        score += 10;
        scoreEl.textContent = score;
        spawnParticles(en.x, en.y, `${en.hue},180,255`, 12);
      }
    });
  });
  enemies = enemies.filter(en => en.alive);

  // enemy bullet - player collision
  const pb = { x: player.x-player.w/2, y: player.y-player.h/2, w: player.w, h: player.h };
  enemyBullets.forEach(b => {
    const bb = { x: b.x-2, y: b.y-6, w: 4, h: 12 };
    if (rectsOverlap(bb, pb)) {
      b.y = H + 999;
      loseLife();
      spawnParticles(player.x, player.y, '255,120,120', 10);
    }
  });

  // enemy direct collision with player
  enemies.forEach(en => {
    const eb = { x: en.x-en.w/2, y: en.y-en.h/2, w: en.w, h: en.h };
    if (en.alive && rectsOverlap(eb, pb)) {
      en.alive = false;
      loseLife();
      spawnParticles(player.x, player.y, '255,120,120', 14);
    }
  });

  // particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // wave complete
  if (enemies.length === 0 && running) {
    waveTimer++;
    if (waveTimer > 60) {
      waveNumber++;
      waveTimer = 0;
      spawnWave();
    }
  }

  if (lives <= 0) endGame();
}

function loseLife() {
  lives--;
  livesEl.textContent = 'Lives: ' + Math.max(lives,0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // stars
  ctx.fillStyle = '#cfe0ff';
  stars.forEach(s => {
    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // player ship
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.fillStyle = '#4fd6ff';
  ctx.shadowColor = '#4fd6ff';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.moveTo(0, -17);
  ctx.lineTo(14, 16);
  ctx.lineTo(0, 9);
  ctx.lineTo(-14, 16);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();

  // player bullets
  ctx.fillStyle = '#ffe37a';
  ctx.shadowColor = '#ffe37a';
  ctx.shadowBlur = 8;
  bullets.forEach(b => ctx.fillRect(b.x-2, b.y-6, 4, 12));
  ctx.shadowBlur = 0;

  // enemy bullets
  ctx.fillStyle = '#ff6b6b';
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 8;
  enemyBullets.forEach(b => ctx.fillRect(b.x-2, b.y-6, 4, 12));
  ctx.shadowBlur = 0;

  // enemies
  enemies.forEach(en => {
    ctx.save();
    ctx.translate(en.x, en.y);
    ctx.fillStyle = `hsl(${en.hue}, 90%, 65%)`;
    ctx.shadowColor = `hsl(${en.hue}, 90%, 65%)`;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(-15, -8);
    ctx.lineTo(15, -8);
    ctx.lineTo(10, 12);
    ctx.lineTo(-10, 12);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  });

  // particles
  particles.forEach(p => {
    ctx.fillStyle = `rgba(${p.color},${Math.max(p.life/40,0)})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    ctx.fill();
  });

  // wave label
  ctx.fillStyle = 'rgba(200,220,255,0.5)';
  ctx.font = '13px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText('Wave ' + waveNumber, W/2, H - 14);
}

let loopId;
function loop() {
  if (!running) return;
  update();
  draw();
  loopId = requestAnimationFrame(loop);
}

function startGame() {
  resetGame();
  spawnWave();
  running = true;
  overlay.style.display = 'none';
  loop();
}

function endGame() {
  running = false;
  cancelAnimationFrame(loopId);
  overlay.innerHTML = `
    <h1>Game Over</h1>
    <div class="stats">Score: ${score}</div>
    <div class="stats" style="font-size:15px;color:#9fb3d9;">Wave reached: ${waveNumber}</div>
    <p></p>
    <button id="restartBtn">Play Again</button>
  `;
  overlay.style.display = 'flex';
  document.getElementById('restartBtn').addEventListener('click', startGame);
}

startBtn.addEventListener('click', startGame);
draw();
</script>
</body>
</html>
